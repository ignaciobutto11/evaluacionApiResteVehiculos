<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vehículos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../views/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../views/Vehiculo.css">
</head>
<body>
<main class="contenedor">

    <header class="encabezado">
        <h1>Gestión de Vehículos</h1>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Nuevo Vehículo
        </button>
    </header>

    <!-- MODAL NUEVO -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Nuevo Vehículo</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <form class="formulario">
                        <div class="campo">
                            <label for="MarcaNuevo">Marca</label>
                            <input type="text" class="form-control" id="MarcaNuevo">
                        </div>
                        <div class="campo">
                            <label for="ModeloNuevo">Modelo</label>
                            <input type="text" class="form-control" id="ModeloNuevo">
                        </div>
                        <div class="campo">
                            <label for="AñoNuevo">Año</label>
                            <input type="number" class="form-control" id="AñoNuevo">
                        </div>
                        <div class="campo">
                            <label for="PatenteNuevo">Patente</label>
                            <input type="text" class="form-control" id="PatenteNuevo">
                        </div>
                        <div class="campo">
                            <label for="KmNuevo">Km</label>
                            <input type="number" class="form-control" id="KmNuevo">
                        </div>
                        <div class="campo">
                            <label for="FechaDeIngresoNuevo">Fecha de ingreso</label>
                            <input type="date" class="form-control" id="FechaDeIngresoNuevo">
                        </div>
                        <div class="form-check form-switch campo-disponible">
                            <input type="checkbox" class="form-check-input" role="switch" id="DisponibleNuevo">
                            <label for="DisponibleNuevo">Disponible</label>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button onclick="AgregarVehiculo()" type="button" class="btn btn-primary">Agregar Vehículo</button>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalEditarLabel">Editar Vehículo</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <form class="formulario">
                        <input type="hidden" id="idEditar">

                        <div class="campo">
                            <label for="MarcaEditar">Marca</label>
                            <input type="text" class="form-control" id="MarcaEditar">
                        </div>
                        <div class="campo">
                            <label for="ModeloEditar">Modelo</label>
                            <input type="text" class="form-control" id="ModeloEditar">
                        </div>
                        <div class="campo">
                            <label for="AñoEditar">Año</label>
                            <input type="number" class="form-control" id="AñoEditar">
                        </div>
                        <div class="campo">
                            <label for="PatenteEditar">Patente</label>
                            <input type="text" class="form-control" id="PatenteEditar">
                        </div>
                        <div class="campo">
                            <label for="KmEditar">Km</label>
                            <input type="number" class="form-control" id="KmEditar">
                        </div>
                        <div class="campo">
                            <label for="FechaDeIngresoEditar">Fecha de ingreso</label>
                            <input type="date" class="form-control" id="FechaDeIngresoEditar">
                        </div>
                        <div class="form-check form-switch campo-disponible">
                            <input type="checkbox" class="form-check-input" role="switch" id="DisponibleEditar">
                            <label for="DisponibleEditar">Disponible</label>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button onclick="EditarVehiculo()" type="button" class="btn btn-primary">Guardar cambios</button>
                </div>

            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="tabla-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Marca</th>
                    <th scope="col">Modelo</th>
                    <th scope="col">Año</th>
                    <th scope="col">Patente</th>
                    <th scope="col">Km</th>
                    <th scope="col">Fecha de ingreso</th>
                    <th scope="col">Disponible</th>
                    <th scope="col">Editar</th>
                    <th scope="col">Eliminar</th>
                </tr>
            </thead>
            <tbody id="tablaVehiculo">
                <!-- Aquí se llenarán los datos de los vehículos -->
            </tbody>
        </table>
    </div>

</main>

    <script src="../views/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="../views/Vehiculo.js"></script>
    <script src="../views/js/jquery.js"></script>
</body>
</html>
